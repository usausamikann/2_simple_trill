<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--スマホ用-->
    <title>Simple Trill Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="timer">Time : 5</p>
    <div id="buttons">
        <button id="left-button" class="hit-area"><!--hit-area:実際の判定範囲-->
            <span class="button-mark"><!--button-mark:表示されているボタン-->
                <span class="pc-mark">F</span>
                <span class="touch-mark">左</span>
            </span>
        </button>
        <button id="right-button" class="hit-area">
            <span class="button-mark">
                <span class="pc-mark">J</span>
                <span class="touch-mark">右</span>
            </span>
        </button>
    </div>
    <p id="score">Score: 0</p>
    <button id="retry" style="display: none;">Retry</button><!--リトライボタン-->
    <script src="script.js"></script>
</body>

</html>
